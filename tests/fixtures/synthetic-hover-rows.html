<!-- Synthetic fixture, hand written for tests/test_state_contract.py. It is not a
     generated application and it implements no requirement; its rows are named after
     the synthetic contract's seeds so the check's hover pass reaches them. It is the
     shape every interface rule is meant to accept:

       * row actions revealed only on hover, named by their verb alone, so the row's
         own title is answered by the row's text and by nothing else,
       * every verb the helpers use for a row action reachable inside the row,
       * a chooser that makes the rest of the page inert rather than declaring itself
         modal, so nothing outside it is addressable while it is open,
       * a composer whose re-render carries the text already typed into it. -->
<style>
  .row { padding: 6px; border: 1px solid #ccc; }
  .row .actions { display: none; }
  .row:hover .actions, .row:focus-within .actions { display: block; }
  #categories[hidden] { display: none; }
</style>

<div id="page">
  <nav aria-label="Filters">
    <button type="button" role="menuitem">Utilities</button>
    <button type="button" role="menuitem">Preferences</button>
  </nav>

  <ul>
    <li class="row" tabindex="0">
      <div class="title">Opening balance</div>
      <div class="actions">
        <button type="button" aria-label="More options">M</button>
        <button type="button" aria-label="Color">C</button>
        <button type="button" aria-label="Pin">P</button>
        <button type="button" aria-label="Archive">A</button>
      </div>
    </li>
    <li class="row" tabindex="0">
      <div class="title">Monthly rent</div>
      <div class="actions">
        <button type="button" aria-label="More options">M</button>
        <button type="button" aria-label="Color">C</button>
        <button type="button" aria-label="Pin">P</button>
        <button type="button" aria-label="Archive">A</button>
      </div>
    </li>
    <li class="row" tabindex="0">
      <div class="title">Scrap me 2.2</div>
      <div class="actions">
        <button type="button" aria-label="More options">M</button>
        <button type="button" aria-label="Color">C</button>
        <button type="button" aria-label="Pin">P</button>
        <button type="button" aria-label="Archive">A</button>
      </div>
    </li>
  </ul>

  <button type="button" id="open-categories">Edit categories</button>

  <div id="composer">
    <input id="entry-title" aria-label="Title" placeholder="Title">
    <button type="button" id="pin" aria-label="Pin new entry">Pin</button>
  </div>
</div>

<div id="categories" role="dialog" aria-label="Categories" hidden>
  <button type="button" aria-label="Utilities for Opening balance">Utilities</button>
  <button type="button" aria-label="Close categories">Close</button>
</div>

<script>
  document.getElementById('open-categories').addEventListener('click', function () {
    document.getElementById('categories').hidden = false;
    // What aria-modal only claims: the resolver honours inert, so nothing behind the
    // chooser answers to a name or is the first textbox on the page.
    document.getElementById('page').inert = true;
  });
  // The durable re-render: the field is rebuilt, and its current value goes with it.
  function bindPin() {
    document.getElementById('pin').addEventListener('click', function () {
      var composer = document.getElementById('composer');
      var value = document.getElementById('entry-title').value;
      composer.innerHTML = '<input id="entry-title" aria-label="Title" placeholder="Title" value="'
        + value.replace(/"/g, '&quot;') + '">'
        + '<button type="button" id="pin" aria-label="Pin new entry">Pin</button>';
      bindPin();
    });
  }
  bindPin();
</script>

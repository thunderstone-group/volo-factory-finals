id: ROOT
name: Github Finals Proxy Evolution Prose
type: FOLDER
description: |-
  This product extends the participant's selected GitHub collaboration application. Repository browsing, sign-in, organization membership, file management, issues and pull requests retain their existing behavior except where an atomic change below extends it. The additional work concerns issue discovery, repository metadata, discussions and review. Real-time collaboration, Actions, Packages, Wiki, project boards, notification delivery and external Git remote protocols remain outside the product's scope.

  Values described as existing accounts, repositories, branches, files, issues, labels, milestones, pull requests or reviews are predefined seed data. The system provisions these before the scenarios begin. Each scenario starts at the home page in a fresh unauthenticated browser session and uses its own EV-suffixed repository and records. Scenarios can be performed independently and in any order against the same running application; they must not depend on resetting another scenario's data. The original accounts are reused with their documented credentials, which these scenarios do not change. Saved application data remains available when the user navigates away or refreshes.

  Unless an atomic requirement permits more than one navigation role, quoted user-interface wording is the exact English accessible name; the role, scope and observable-state rules of the atomic requirement are authoritative. Existing permission relationships remain operation-specific. Implementations may choose their framework, storage and page-entry format without depending on a private setup API.
dependencies: []
children:
- id: EV-1.1
  name: Filter issues with combined qualifiers
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-1-1
  dependencies:
  - REQ-5-1-1
  description: |-
    Users can narrow the repository's issue list with a combined query instead of searching only for words in a title. On the Issues page, the “Issues” region presents the “Search issues” searchbox and the “Issue titles” list. The query accepts `is:open`, `is:closed`, `label:<name>` and `author:<username>` together; every condition must match. A status qualifier takes precedence over the currently selected status tab, while words without a qualifier continue to match the issue title. Matching titles are shown newest first, and excluded issues must not remain as result links. Refreshing this page retains the query and its matching results.

    The repository is reached through the global “Search” field: the visitor submits its seeded name with Enter and opens the matching entry. Its overview identifies it with an owner/name heading. This operation uses the existing repository context and preserves the original access rules. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Filter issues with combined qualifiers
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The system pre-provisions the public repository `evolution-EV-1.1` owned by repo-admin. The original
        account repo-admin has Admin permission; issue-editor, issue-commenter, file-contributor and pr-contributor
        have Write permission; issue-viewer and pr-viewer have Read permission; pr-author may manage its
        own PRs and pr-reviewer may review non-authored PRs. main is the default branch. All records in
        this scenario belong only to this repository. Issues are `Bug EV-1.1` (Closed, label bug, author
        issue-editor), `Open EV-1.1` (Open, bug, issue-editor), and `Other EV-1.1` (Closed, docs, issue-commenter).
    - keyword: WHEN
      content: The user enters `evolution-EV-1.1` in the visibly labeled “Search” field, presses `Enter`
        in “Search”, and opens “evolution-EV-1.1”.
    - keyword: THEN
      content: The “repo-admin/evolution-EV-1.1” heading appears once and is visible.
    - keyword: WHEN
      content: The user opens “Issues” and enters `is:closed label:bug author:issue-editor` in the visibly
        labeled “Search issues” field.
    - keyword: THEN
      content: The “Issue titles” list in the “Issues” region shows `Bug EV-1.1`, in that reading order,
        with no additional entries. The “Open EV-1.1” link does not appear in the “Issues” region.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: The “Issue titles” list in the “Issues” region shows `Bug EV-1.1`, in that reading order,
        with no additional entries.
- id: EV-1.2
  name: Sort the filtered issue list
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-1-1
  dependencies:
  - REQ-5-1-1
  description: |-
    Users can change the reading order of the issues they have already filtered. The “Issue sort” combobox on the Issues page offers “Newest” and “Oldest”; choosing an order changes the “Issue titles” list inside the “Issues” region without changing any issue. The order applies to the filtered result set, not to a separate unfiltered list. After refresh, the selector and the displayed titles still agree with the saved choice. Changing the selection again immediately shows the opposite chronological order.

    The repository is reached through the global “Search” field: the visitor submits its seeded name with Enter and opens the matching entry. Its overview identifies it with an owner/name heading. This operation uses the existing repository context and preserves the original access rules. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present. Selecting an option uses the labeled combobox; when collapsed, the selector displays only its selected option.
  scenarios:
  - name: Sort the filtered issue list
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The system pre-provisions the public repository `evolution-EV-1.2` owned by repo-admin. The original
        account repo-admin has Admin permission; issue-editor, issue-commenter, file-contributor and pr-contributor
        have Write permission; issue-viewer and pr-viewer have Read permission; pr-author may manage its
        own PRs and pr-reviewer may review non-authored PRs. main is the default branch. All records in
        this scenario belong only to this repository. Open issues `First EV-1.2`, `Second EV-1.2`, `Third
        EV-1.2` were created on 2030-01-01, 2030-01-02 and 2030-01-03 respectively, with no other issues.
    - keyword: WHEN
      content: The user enters `evolution-EV-1.2` in the visibly labeled “Search” field, presses `Enter`
        in “Search”, and opens “evolution-EV-1.2”.
    - keyword: THEN
      content: The “repo-admin/evolution-EV-1.2” heading appears once and is visible.
    - keyword: WHEN
      content: The user opens “Issues” and selects the “Oldest” option in the “Issue sort” combobox in
        the “Issues” region.
    - keyword: THEN
      content: The “Issue titles” list in the “Issues” region shows `First EV-1.2`, then `Second EV-1.2`,
        then `Third EV-1.2`, in that reading order, with no additional entries.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: The “Issue sort” combobox in the “Issues” region shows “Oldest” as its selected option.
    - keyword: WHEN
      content: The user selects the “Newest” option in the “Issue sort” combobox in the “Issues” region.
    - keyword: THEN
      content: The “Issue titles” list in the “Issues” region shows `Third EV-1.2`, then `Second EV-1.2`,
        then `First EV-1.2`, in that reading order, with no additional entries.
- id: EV-1.3
  name: Filter draft pull requests by author
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-6-2-1
  dependencies:
  - REQ-6-2-1
  description: |-
    The Pull requests page supports finding drafts belonging to a particular author. Its “Pull requests” region provides the “Search pull requests” searchbox, and the visible result titles form the “Pull request titles” list. The search understands `is:draft`, `is:open` and `author:<username>`; conditions entered together are combined with AND. A draft is distinct from a ready Open pull request, even though both are unmerged. Filtering changes only the visible results, and refreshing the page preserves the query and the same matching pull-request links.

    The repository is reached through the global “Search” field: the visitor submits its seeded name with Enter and opens the matching entry. Its overview identifies it with an owner/name heading. This operation uses the existing repository context and preserves the original access rules. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:

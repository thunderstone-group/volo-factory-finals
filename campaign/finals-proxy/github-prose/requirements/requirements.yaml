- id: EV-1.8
  name: Switch the pull request diff layout
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-6-3-2
  dependencies:
  - REQ-6-3-2
  description: |-
    Readers inspecting “Files changed” can choose how a pull-request diff is displayed. The “Diff layout” combobox offers “Unified” and “Split”, and its selection survives refresh without modifying the pull request or its files. Split places the old source text in the “Before” region and the new source text in the “After” region. Unified instead uses the “Unified diff” region, with removed and added lines carrying their minus and plus prefixes. Switching layouts keeps the same changed text and continues to support the original read-only diff workflow.


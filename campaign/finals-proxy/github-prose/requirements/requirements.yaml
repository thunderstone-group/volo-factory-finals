    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The system pre-provisions the public repository `evolution-EV-1.3` owned by repo-admin. The original
        account repo-admin has Admin permission; issue-editor, issue-commenter, file-contributor and pr-contributor
        have Write permission; issue-viewer and pr-viewer have Read permission; pr-author may manage its
        own PRs and pr-reviewer may review non-authored PRs. main is the default branch. All records in
        this scenario belong only to this repository. PRs are `Draft EV-1.3` (Draft, pr-author), `Ready
        EV-1.3` (Open, pr-author), and `Other EV-1.3` (Draft, pr-contributor); all compare feature to
        main.
    - keyword: WHEN
      content: The user enters `evolution-EV-1.3` in the visibly labeled “Search” field, presses `Enter`
        in “Search”, and opens “evolution-EV-1.3”.
    - keyword: THEN
      content: The “repo-admin/evolution-EV-1.3” heading appears once and is visible.
    - keyword: WHEN
      content: The user opens “Pull requests” and enters `is:draft author:pr-author` in the visibly labeled
        “Search pull requests” field.
    - keyword: THEN
      content: The “Pull request titles” list in the “Pull requests” region shows `Draft EV-1.3`, in that
        reading order, with no additional entries.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: The “Pull request titles” list in the “Pull requests” region shows `Draft EV-1.3`, in that
        reading order, with no additional entries.
- id: EV-1.4
  name: Close an issue as not planned
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-4
  dependencies:
  - REQ-5-4
  description: |-
    The issue-closing workflow lets an authorized user explain that work will not be pursued. On the issue detail page, the “Issue” region has a “Close reason” combobox with “Completed” selected by default and “Not planned” as the other choice. Clicking the “Close issue” button still saves immediately, but now saves the chosen reason along with Closed status. A not-planned closure displays “Closed as not planned” as its status message. Clicking “Reopen issue” restores Open and removes that closure reason. These changes survive refresh, preserve the issue description and other existing data, and retain the original operation-specific permission rules.

    The repository is reached through the global “Search” field: the visitor submits its seeded name with Enter and opens the matching entry. Its overview identifies it with an owner/name heading. This operation uses the existing repository context and preserves the original access rules. When sign-in is required below, the visitor opens “Sign in”, fills the visibly labeled “Username or email” and masked “Password” inputs, and submits the “Sign in” button. The signed-in workspace provides the “Account menu” button. Account switches follow “Sign out” and confirm through “Confirm sign out” in the “Sign out” dialog. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present. Selecting an option uses the labeled combobox; when collapsed, the selector displays only its selected option. A status or alert carries its complete visible message as its accessible name.
  scenarios:
  - name: Close an issue as not planned
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The system pre-provisions the public repository `evolution-EV-1.4` owned by repo-admin. The original
        account repo-admin has Admin permission; issue-editor, issue-commenter, file-contributor and pr-contributor
        have Write permission; issue-viewer and pr-viewer have Read permission; pr-author may manage its
        own PRs and pr-reviewer may review non-authored PRs. main is the default branch. All records in
        this scenario belong only to this repository. `Declined EV-1.4` is Open, with description `Keep
        this description.` and no closure reason. The system also pre-provisions the original verified
        account `repo-admin` has email `repo-admin@example.test` and password `Valid-password-123!`. Its
        credentials are never changed by these scenarios.
    - keyword: WHEN
      content: The user opens “Sign in”, enters `repo-admin` in the visibly labeled “Username or email”
        field, enters `Valid-password-123!` in the visibly labeled “Password” field, and clicks the “Sign
        in” button.
    - keyword: THEN
      content: The “Account menu” button appears once and is visible.
    - keyword: WHEN
      content: The user enters `evolution-EV-1.4` in the visibly labeled “Search” field, presses `Enter`
        in “Search”, and opens “evolution-EV-1.4”.
    - keyword: THEN
      content: The “repo-admin/evolution-EV-1.4” heading appears once and is visible.
    - keyword: WHEN
      content: The user opens “Issues” and opens “Declined EV-1.4”.
    - keyword: THEN
      content: The “Declined EV-1.4” heading appears once and is visible.
    - keyword: WHEN
      content: The user selects the “Not planned” option in the “Close reason” combobox in the “Issue”
        region and clicks the “Close issue” button in the “Issue” region.
    - keyword: THEN
      content: The complete text `Closed as not planned` appears visibly once in the “Issue” region.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: The complete text `Closed as not planned` appears visibly once in the “Issue” region. The
        complete text `Keep this description.` appears visibly once in the “Issue” region.
    - keyword: WHEN
      content: The user clicks the “Reopen issue” button in the “Issue” region.
    - keyword: THEN
      content: The complete text `Open` appears visibly once in the “Issue” region. The “Closed as not
        planned” status does not appear in the “Issue” region.

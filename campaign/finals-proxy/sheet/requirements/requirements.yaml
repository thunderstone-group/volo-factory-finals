id: ROOT
name: Sheet Finals Proxy Evolution Light
type: FOLDER
description: |-
  Light evolution requirements for the participant's actual spreadsheet finals base. Extend formulas, data cleanup and workbook organization. This remains a public single-user workspace: no account credentials exist in the original sheet task. Sharing, real-time collaboration, advanced styling, charts, macros and external office integrations remain out of scope.

  Benchmark interaction contract: Every scenario starts at the application home entry in a fresh browser context, signed out. Authentication, when required, uses the original Sign in link, Username or email and masked Password inputs, and Sign in button. Navigation controls may be links or buttons with the exact accessible names stated below; form actions are buttons. Every named control or landmark is unique within its stated scope and visible when used. Inputs have associated labels matching the stated names. Named regions and dialogs expose those accessible roles and names. Native or custom selectors expose combobox and option semantics; a collapsed custom selector displays only the selected option. Lists expose list and listitem semantics in reading order. Status and alert messages have matching accessible names and visible text. Checked, selected and pressed states use their corresponding ARIA/native semantics. An absent control has zero matching accessible elements. Seed records described in GIVEN steps exist in the initial application state, rather than being created by another test. All EV-suffixed resources are distinct records; mutations affect only the current scenario's records. Original accounts and credentials are reused without changing credentials or shared account preferences. All 30 scenarios must work in any order on one continuously running application with a fresh browser context per test and no server reset. Persistence means saved application data survives navigation and reload. No private setup API, implementation-specific URL, framework, database key, CSS selector or particular markup structure is required. Preserve all original behavior except the explicitly described extension; unchanged controls retain their original names and semantics.
dependencies: []
children:
- id: EV-1.1
  name: Calculate IF with a comparison
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-1-1
  dependencies:
  - REQ-4-1-1
  description: |-
    Extend formulas with IF(condition, true_value, false_value), comparisons and quoted string literals. IF evaluates only the selected branch. Existing arithmetic and aggregates remain valid.

    The current page contains one link or button named "Calculate EV-1.1" when this action is available. The current page exposes "Worksheet grid" as a grid. A visible grid named "Worksheet grid" contains the controls and content within it in the scenario. The grid named "Worksheet grid" exposes "B1" as a gridcell. The current page contains one input labelled "Formula bar". The grid named "Worksheet grid" exposes "A1" as a gridcell.
  scenarios:
  - name: Calculate IF with a comparison
    steps:
    - keyword: GIVEN
      content: The user opens the application home entry in a fresh browser context, signed out.
    - keyword: GIVEN
      content: The public workbook "Calculate EV-1.1" exists independently of every other scenario. Unless
        stated otherwise, it has only Sheet1, active with A1 selected, at least 100 rows and 26 columns,
        and all unspecified cells blank; there are no filters, validation rules, notes or named ranges.
        A1=12 and B1 is blank.
    - keyword: WHEN
      content: The user activates "Calculate EV-1.1" in the current page.
    - keyword: THEN
      content: The grid named "Worksheet grid" is visible exactly once in the current page.
    - keyword: WHEN
      content: The user clicks the gridcell named "B1" in the grid named "Worksheet grid".
    - keyword: WHEN
      content: The user enters "=IF(A1>=10,\"Ready\",\"Wait\")" in the "Formula bar" field in the current
        page.
    - keyword: WHEN
      content: The user presses "Enter" in the "Formula bar" field in the current page.
    - keyword: THEN
      content: The gridcell named "B1" in the grid named "Worksheet grid" has exact text "Ready".
    - keyword: WHEN
      content: The user clicks the gridcell named "A1" in the grid named "Worksheet grid".
    - keyword: WHEN
      content: The user enters "4" in the "Formula bar" field in the current page.
    - keyword: WHEN
      content: The user presses "Enter" in the "Formula bar" field in the current page.
    - keyword: THEN
      content: The gridcell named "B1" in the grid named "Worksheet grid" has exact text "Wait".
    - keyword: WHEN
      content: The user reloads the current page.
    - keyword: THEN
      content: The gridcell named "B1" in the grid named "Worksheet grid" has exact text "Wait".
    - keyword: WHEN
      content: The user clicks the gridcell named "B1" in the grid named "Worksheet grid".
    - keyword: THEN
      content: The "Formula bar" field in the current page displays "=IF(A1>=10,\"Ready\",\"Wait\")".

id: ROOT
name: Github Finals Proxy Evolution Light
type: FOLDER
description: |-
  Light evolution requirements for the participant's actual GitHub-like finals base. Extend issue discovery, repository metadata, discussion management and pull-request review. Actions, Packages, Wiki, project boards, notification delivery, real-time collaboration and external Git protocols remain out of scope.

  Benchmark interaction contract: Every scenario starts at the application home entry in a fresh browser context, signed out. Authentication, when required, uses the original Sign in link, Username or email and masked Password inputs, and Sign in button. Navigation controls may be links or buttons with the exact accessible names stated below; form actions are buttons. Every named control or landmark is unique within its stated scope and visible when used. Inputs have associated labels matching the stated names. Named regions and dialogs expose those accessible roles and names. Native or custom selectors expose combobox and option semantics; a collapsed custom selector displays only the selected option. Lists expose list and listitem semantics in reading order. Status and alert messages have matching accessible names and visible text. Checked, selected and pressed states use their corresponding ARIA/native semantics. An absent control has zero matching accessible elements. Seed records described in GIVEN steps exist in the initial application state, rather than being created by another test. All EV-suffixed resources are distinct records; mutations affect only the current scenario's records. Original accounts and credentials are reused without changing credentials or shared account preferences. All 30 scenarios must work in any order on one continuously running application with a fresh browser context per test and no server reset. Persistence means saved application data survives navigation and reload. No private setup API, implementation-specific URL, framework, database key, CSS selector or particular markup structure is required. Preserve all original behavior except the explicitly described extension; unchanged controls retain their original names and semantics.
dependencies: []
children:
- id: EV-1.1
  name: Filter issues with combined qualifiers
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-1-1
  dependencies:
  - REQ-5-1-1
  description: |-
    Extend Search issues with conjunctive is:open, is:closed, label:<name> and author:<username> qualifiers; unqualified text still matches titles. Qualifiers override the selected status tab. Issue titles lists only matching titles, newest first.

    The current page contains one input labelled "Search". The current page contains one link or button named "evolution-EV-1.1" when this action is available. The current page exposes "repo-admin/evolution-EV-1.1" as a heading. The current page contains one link or button named "Issues" when this action is available. The current page contains one input labelled "Search issues". A visible region named "Issues" contains the controls and content within it in the scenario. The region named "Issues" exposes "Issue titles" as a list. The list named "Issue titles" in the region named "Issues" contains listitems with the exact stated visible text, in reading order. The region named "Issues" exposes "Open EV-1.1" as a link.
  scenarios:
  - name: Filter issues with combined qualifiers
    steps:
    - keyword: GIVEN
      content: The user opens the application home entry in a fresh browser context, signed out.
    - keyword: GIVEN
      content: The public repository "evolution-EV-1.1" is owned by repo-admin. The original account repo-admin
        has Admin permission; issue-editor, issue-commenter, file-contributor and pr-contributor have
        Write permission; issue-viewer and pr-viewer have Read permission; pr-author may manage its own
        PRs and pr-reviewer may review non-authored PRs. main is the default branch. All records in this
        scenario belong only to this repository. Issues are "Bug EV-1.1" (Closed, label bug, author issue-editor),
        "Open EV-1.1" (Open, bug, issue-editor), and "Other EV-1.1" (Closed, docs, issue-commenter).
    - keyword: WHEN
      content: The user enters "evolution-EV-1.1" in the "Search" field in the current page.
    - keyword: WHEN
      content: The user presses "Enter" in the "Search" field in the current page.
    - keyword: WHEN
      content: The user activates "evolution-EV-1.1" in the current page.
    - keyword: THEN
      content: The heading named "repo-admin/evolution-EV-1.1" is visible exactly once in the current
        page.
    - keyword: WHEN
      content: The user activates "Issues" in the current page.
    - keyword: WHEN
      content: The user enters "is:closed label:bug author:issue-editor" in the "Search issues" field
        in the current page.
    - keyword: THEN
      content: 'The "Issue titles" list in the region named "Issues" contains exactly these entries in
        order: ["Bug EV-1.1"].'
    - keyword: THEN
      content: The link named "Open EV-1.1" is absent in the region named "Issues".
    - keyword: WHEN
      content: The user reloads the current page.
    - keyword: THEN
      content: 'The "Issue titles" list in the region named "Issues" contains exactly these entries in
        order: ["Bug EV-1.1"].'

  description: |-
    “Make a copy” opens the “Copy workbook” dialog with “Workbook name” and “Create copy”. Creating the copy duplicates all worksheets, formulas, notes and rules into a separate workbook and opens it under its new heading. Editing its values recalculates its own formulas without changing the source workbook. Both records remain available through their workbook-name links on the home page; reopening the original and the copy, or refreshing the copy, shows their separate saved states.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Make an independent workbook copy
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Make EV-3.10`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=6,B1 has formula =A1*3. No workbook named `Independent EV-3.10`
        exists.
    - keyword: WHEN
      content: The user opens “Make EV-3.10”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user clicks the “Make a copy” button, enters `Independent EV-3.10` in the visibly labeled
        “Workbook name” field in the “Copy workbook” dialog, and clicks the “Create copy” button in the
        “Copy workbook” dialog.
    - keyword: THEN
      content: The “Independent EV-3.10” heading appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `A1` in the “Worksheet grid” grid, enters `7` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `21`.
    - keyword: WHEN
      content: The user returns to the application home page and opens “Make EV-3.10”.
    - keyword: THEN
      content: Cell `A1` in the “Worksheet grid” grid displays exactly `6`. Cell `B1` in the “Worksheet
        grid” grid displays exactly `18`.
    - keyword: WHEN
      content: The user returns to the application home page, opens “Independent EV-3.10”, and refreshes
        the current page.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `21`.

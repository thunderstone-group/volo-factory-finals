id: ROOT
name: Sheet Finals Proxy Evolution Prose
type: FOLDER
description: |-
  This product extends the participant's selected online spreadsheet workspace. Workbook and worksheet management, cell editing, formulas, data organization, validation and pivot analysis continue to follow the original requirements, with the changes and additions below. The new work extends formulas, range naming, data cleanup and workbook organization. This remains a public single-user workspace: the original task does not define accounts or passwords. Sharing, real-time collaboration, advanced visual styling, charts, macros and external office integrations remain outside scope.

  The workbooks and cell contents described as existing are evaluation seed data, available before the corresponding scenario. Each scenario begins at the home page in a fresh unauthenticated browser session and has a separate EV-suffixed workbook. The scenarios can be performed independently and in any order on one running application, without relying on a server reset or another scenario's changes. Successful edits remain visible through the same workbook when the user navigates away, reopens it or refreshes. Other workbooks and worksheets remain unchanged unless an operation explicitly includes them.

  Quoted control wording is the exact English accessible name, and the role, scope and observable-state rules in the atomic requirements determine the visible result. The implementation may choose its framework, storage and workbook-entry format; users perform these operations through the described interface without a private setup API.
dependencies: []
children:
- id: EV-1.1
  name: Calculate IF with a comparison
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-1-1
  dependencies:
  - REQ-4-1-1
  description: |-
    The existing formula editor accepts conditional expressions using `IF(condition, true_value, false_value)`, comparison operators and quoted strings. A formula evaluates only its selected branch, while existing arithmetic and aggregate functions remain available. The user selects the destination cell, enters the expression in “Formula bar” and commits with Enter; the grid shows the result while the formula bar retains the expression. Editing the source cell recalculates the conditional result. Refreshing restores the saved source value, formula and current result.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Calculate IF with a comparison
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Calculate EV-1.1`, separate from the workbooks
        used in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=12 and B1 is blank.
    - keyword: WHEN
      content: The user opens “Calculate EV-1.1”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid, enters `=IF(A1>=10,"Ready","Wait")`
        in the visibly labeled “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `Ready`.
    - keyword: WHEN
      content: The user selects cell `A1` in the “Worksheet grid” grid, enters `4` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `Wait`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `Wait`.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid.
    - keyword: THEN
      content: The “Formula bar” field  displays the saved value `=IF(A1>=10,"Ready","Wait")`.
- id: EV-1.2
  name: Count matching values with COUNTIF
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-1-1
  dependencies:
  - REQ-4-1-1
  description: |-
    The formula engine supports `COUNTIF(range, criterion)` in addition to the existing aggregate functions. It counts cells matching the criterion, including numeric comparison prefixes and exact text comparisons that ignore letter case. The user enters the formula through “Formula bar” for a selected cell. Committing a change in the source range recalculates the count rather than retaining the original result, and refreshing preserves the source edit and the resulting count.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Count matching values with COUNTIF
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Count EV-1.2`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=5, A2=10, A3=15, A4=20. B1 is blank.
    - keyword: WHEN
      content: The user opens “Count EV-1.2”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid, enters `=COUNTIF(A1:A4,">10")`
        in the visibly labeled “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `2`.
    - keyword: WHEN
      content: The user selects cell `A2` in the “Worksheet grid” grid, enters `11` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `3`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `3`.
- id: EV-1.3
  name: Sum matching rows with SUMIF
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-1-1
  dependencies:
  - REQ-4-1-1
  description: |-
    Users can total matching records with `SUMIF(criteria_range, criterion, sum_range)`. The criterion accepts case-insensitive text matching or a numeric comparison; only numeric values in corresponding matching rows contribute to the sum. Entering the expression through “Formula bar” displays the calculated total in the destination cell. Editing a value on a nonmatching row must leave that total unchanged. Formula expressions, source values and results remain consistent after refresh.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Sum matching rows with SUMIF
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Sum EV-1.3`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=East, A2=West, A3=East; B1=12, B2=99, B3=8.
    - keyword: WHEN
      content: The user opens “Sum EV-1.3”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `C1` in the “Worksheet grid” grid, enters `=SUMIF(A1:A3,"East",B1:B3)`
        in the visibly labeled “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `C1` in the “Worksheet grid” grid displays exactly `20`.
    - keyword: WHEN
      content: The user selects cell `B2` in the “Worksheet grid” grid, enters `1000` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `C1` in the “Worksheet grid” grid displays exactly `20`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `C1` in the “Worksheet grid” grid displays exactly `20`.
- id: EV-1.4
  name: Recover from formula errors with IFERROR
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-2-2
  dependencies:
  - REQ-4-2-2
  description: |-
    A formula can handle an error with `IFERROR(expression, fallback)`. The fallback is used only when the expression produces an error; once the source is corrected, the same formula returns its ordinary result without being rewritten. The user enters and edits values through “Formula bar”, and the worksheet displays the recalculated result. An unrelated error, such as `#DIV/0!` in another cell, remains visible. Refreshing preserves both the corrected result and any still-existing independent error.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Recover from formula errors with IFERROR
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Recover EV-1.4`, separate from the workbooks
        used in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=0 and C1 has formula =1/0.
    - keyword: WHEN
      content: The user opens “Recover EV-1.4”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid, enters `=IFERROR(10/A1,"Pending")`
        in the visibly labeled “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `Pending`. Cell `C1` in the “Worksheet
        grid” grid displays exactly `#DIV/0!`.
    - keyword: WHEN
      content: The user selects cell `A1` in the “Worksheet grid” grid, enters `2` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `5`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `5`. Cell `C1` in the “Worksheet
        grid” grid displays exactly `#DIV/0!`.
- id: EV-1.5
  name: Recalculate cross-worksheet references
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-4-2-1
  dependencies:
  - REQ-4-2-1
  description: |-
    Formulas may refer to another worksheet using `SheetName!A1`, including a worksheet name enclosed in single quotes. The user can write such an expression in “Formula bar”, switch to the source worksheet's tab and edit the referenced value there. Returning to the dependent worksheet immediately shows its recalculated result. The source sheet's content must not replace the dependent sheet's content, and reopening or refreshing retains the formula and the result calculated from the latest source value.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Recalculate cross-worksheet references
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Recalculate EV-1.5`, separate from the workbooks
        used in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. Tabs are Sheet1 and Rates; Sheet1!A1=10, Rates!A1=2. Sheet1 is active.
    - keyword: WHEN
      content: The user opens “Recalculate EV-1.5”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid, enters `=A1*'Rates'!A1` in the
        visibly labeled “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `20`.
    - keyword: WHEN
      content: The user selects the “Rates” worksheet tab, selects cell `A1` in the “Worksheet grid” grid,
        enters `3` in the visibly labeled “Formula bar” field, presses `Enter` in “Formula bar”, and selects
        the “Sheet1” worksheet tab.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `30`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `30`.
- id: EV-1.6
  name: Sort by a secondary column
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-1-1
  dependencies:
  - REQ-5-1-1
  description: |-
    The existing “Sort range” operation supports a secondary key. Its dialog retains “Sort by”, “Order” and the “Data has header row” checkbox, and adds the optional “Then by” combobox, initially “None”, and “Then order”. Clicking “Sort” compares whole records by the primary column first, using the second column only for tied primary keys. The declared header stays in place, and cells outside the selected rectangle remain unchanged. The sorted records and their column alignment persist after refresh.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present. Selecting an option uses the labeled combobox; when collapsed, the selector displays only its selected option.
  scenarios:
  - name: Sort by a secondary column
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Sort EV-1.6`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=Team,B1=Score; A2=Blue,B2=5; A3=Red,B3=3; A4=Blue,B4=9; D1=Sentinel.
    - keyword: WHEN
      content: The user opens “Sort EV-1.6”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user brings cells `A1` and `B4` into view in the “Worksheet grid” grid, then drags
        from `A1` to `B4` to select that rectangle, clicks the “Data” button, clicks the “Sort range”
        menu command, checks the “Data has header row” checkbox in the “Sort range” dialog, selects the
        “Team” option in the “Sort by” combobox in the “Sort range” dialog, selects the “Ascending” option
        in the “Order” combobox in the “Sort range” dialog, selects the “Score” option in the “Then by”
        combobox in the “Sort range” dialog, selects the “Descending” option in the “Then order” combobox
        in the “Sort range” dialog, and clicks the “Sort” button in the “Sort range” dialog.
    - keyword: THEN
      content: Cell `A2` in the “Worksheet grid” grid displays exactly `Blue`. Cell `B2` in the “Worksheet
        grid” grid displays exactly `9`. Cell `B3` in the “Worksheet grid” grid displays exactly `5`.
        Cell `A4` in the “Worksheet grid” grid displays exactly `Red`. Cell `D1` in the “Worksheet grid”
        grid displays exactly `Sentinel`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `B2` in the “Worksheet grid” grid displays exactly `9`.
- id: EV-1.7
  name: Allow invalid input with a validation warning
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-5-2-1
  dependencies:
  - REQ-5-2-1
  description: |-
    Numeric and dropdown validation can warn instead of rejecting a user's value. The “Data validation” dialog retains its existing fields and adds the “On invalid data” combobox with “Reject input” selected by default and “Show warning” as the alternative. Reject input keeps the original complete-operation rejection behavior. With Show warning, an invalid value is committed and “Validation warning” is displayed when that cell is selected. Saving and reopening retain both the rule's parameters and the invalid-data policy; refreshing also preserves the committed value.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present. Selecting an option uses the labeled combobox; when collapsed, the selector displays only its selected option.
  scenarios:
  - name: Allow invalid input with a validation warning
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Allow EV-1.7`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=5.
    - keyword: WHEN
      content: The user opens “Allow EV-1.7”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `A1` in the “Worksheet grid” grid, clicks the “Data” button, clicks
        the “Data validation” menu command, selects the “Number range” option in the “Rule type” combobox
        in the “Data validation” dialog, enters `0` in the visibly labeled “Minimum” field in the “Data
        validation” dialog, enters `10` in the visibly labeled “Maximum” field in the “Data validation”
        dialog, selects the “Show warning” option in the “On invalid data” combobox in the “Data validation”
        dialog, clicks the “Save” button in the “Data validation” dialog, selects cell `A1` in the “Worksheet
        grid” grid, enters `12` in the visibly labeled “Formula bar” field, and presses `Enter` in “Formula
        bar”.
    - keyword: THEN
      content: Cell `A1` in the “Worksheet grid” grid displays exactly `12`. The complete text `Validation
        warning` appears visibly once.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `A1` in the “Worksheet grid” grid displays exactly `12`.
    - keyword: WHEN
      content: The user clicks the “Data” button and clicks the “Data validation” menu command.
    - keyword: THEN
      content: The “On invalid data” combobox in the “Data validation” dialog shows “Show warning” as
        its selected option.
- id: EV-1.8
  name: Paste only calculated values
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-3-2-1
  dependencies:
  - REQ-3-2-1
  description: |-
    The grid's context menu provides “Paste values only” alongside the existing copy and paste operations. After a user copies a rectangular selection, this command writes its calculated values into the selected destination with the same two-dimensional layout, removing formula expressions from the target cells. Source cells remain unchanged, and ordinary Paste continues to copy formulas. “Formula bar” therefore shows an ordinary value for a values-only target. Subsequent source edits recalculate the source formulas but leave those pasted values fixed, including after refresh.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Paste only calculated values
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Paste EV-1.8`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. A1=7; B1 has formula =A1*2; D1 is blank.
    - keyword: WHEN
      content: The user opens “Paste EV-1.8”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user selects cell `B1` in the “Worksheet grid” grid, presses `Control+c` on cell `B1`
        in the “Worksheet grid” grid, right-clicks cell `D1` in the “Worksheet grid” grid, and clicks
        the “Paste values only” menu command.
    - keyword: THEN
      content: Cell `D1` in the “Worksheet grid” grid displays exactly `14`.
    - keyword: WHEN
      content: The user selects cell `D1` in the “Worksheet grid” grid.
    - keyword: THEN
      content: The “Formula bar” field  displays the saved value `14`.
    - keyword: WHEN
      content: The user selects cell `A1` in the “Worksheet grid” grid, enters `8` in the visibly labeled
        “Formula bar” field, and presses `Enter` in “Formula bar”.
    - keyword: THEN
      content: Cell `B1` in the “Worksheet grid” grid displays exactly `16`. Cell `D1` in the “Worksheet
        grid” grid displays exactly `14`.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: Cell `D1` in the “Worksheet grid” grid displays exactly `14`.
- id: EV-1.9
  name: Undo and redo a worksheet rename
  type: ATOMIC
  change_type: CHANGE
  original_requirement_id: REQ-3-2-2
  dependencies:
  - REQ-3-2-2
  description: |-
    Workbook session undo history also covers worksheet renaming. The worksheet-options menu's “Rename” command opens the “Rename worksheet” dialog, with the current “Worksheet name” and a “Save” button. After a successful rename, “Undo” restores the previous tab name and keeps its data; “Redo” reapplies the saved name. These operations use the same workbook's session history and must not modify another workbook. The name and data visible after Redo remain after refresh.

    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present.
  scenarios:
  - name: Undo and redo a worksheet rename
    steps:
    - keyword: GIVEN
      content: The visitor starts at the application home page in a fresh, unauthenticated browser session.
        The evaluation seed contains the public workbook `Undo EV-1.9`, separate from the workbooks used
        in the other scenarios. Unless stated otherwise, it has only Sheet1, active with A1 selected,
        at least 100 rows and 26 columns, and all unspecified cells blank; there are no filters, validation
        rules, notes or named ranges. Sheet1!A1=Preserved.
    - keyword: WHEN
      content: The user opens “Undo EV-1.9”.
    - keyword: THEN
      content: The “Worksheet grid” grid appears once and is visible.
    - keyword: WHEN
      content: The user clicks the “Worksheet options for Sheet1” button, clicks the “Rename” menu command,
        enters `Renamed EV-1.9` in the visibly labeled “Worksheet name” field in the “Rename worksheet”
        dialog, clicks the “Save” button in the “Rename worksheet” dialog, and clicks the “Undo” button.
    - keyword: THEN
      content: The “Sheet1” worksheet tab appears once and is visible. The “Renamed EV-1.9” worksheet
        tab does not appear. Cell `A1` in the “Worksheet grid” grid displays exactly `Preserved`.
    - keyword: WHEN
      content: The user clicks the “Redo” button.
    - keyword: THEN
      content: The “Renamed EV-1.9” worksheet tab appears once and is visible.
    - keyword: WHEN
      content: The user refreshes the current page.
    - keyword: THEN
      content: The “Renamed EV-1.9” worksheet tab appears once and is visible. Cell `A1` in the “Worksheet
        grid” grid displays exactly `Preserved`.
- id: EV-1.10
  name: Concatenate cell text in a formula
  type: ATOMIC
  change_type: CHANGE

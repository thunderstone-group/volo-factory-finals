    The user opens the seeded workbook through its workbook-name entry on the home page. Its active worksheet is displayed by the ARIA grid “Worksheet grid”, with coordinate-named gridcells and selection represented by aria-selected. Worksheet tabs retain their tab role and selected state; row and column headers retain their corresponding header roles. Menu commands use menuitem semantics unless a different role is stated. The visible controls used for this workflow are unique within the page or the stated dialog or region. Navigation entries may be links or buttons unless a particular role is stated, while form submissions use buttons and inputs have the visible labels shown below. The named sections, dialogs, articles and lists use their corresponding accessible roles; list items show the complete stated text in reading order. A control described as absent is not present. Checking, selection and pressed states are exposed through their native or ARIA state as well as the visible interface.
